AWSTemplateFormatVersion: 2010-09-09
Description: Cloudformation Demo
Parameters:
  Environment:
    Type: String
    Description: Environment name
Resources:
  sqsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "cloudformation-lambda-demo-queue-${Environment}"

  lambdaFunctionIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "cloudformation-demo-lambda-sqs-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "*"

        - PolicyName: "allow-sqs-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt sqsQueue.Arn

    LambdaFunctionEventSourceMapping:
      Type: AWS::Lambda::EventSourceMapping
      Properties:
        BatchSize: 10
        Enabled: true
        EventSourceArn: !GetAtt sqsQueue.Arn
        FunctionName: !GetAtt lambdaFunction.Arn

  lambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: "CloudFormation Lambda with Sqs Demo"
      FunctionName: !Sub "cloudformation-lambda-demo-${Environment}"
      Handler: AWSCloudFormation::AWSCloudFormation.Function::FunctionHandler
      MemorySize: 128
      Role: !GetAtt lambdaFunctionIamRole.Arn
      Runtime: dotnet8
      Timeout: 30
      Environment:
        Variables:
          key1: value1
      Code:
        S3Bucket: cloudformation-lambda-demo-package
        S3Key: cloudformation-lambda.zip
      Tags:
        - Key: keyname
          Value: value
